# Installeurs de l'application de bureau, publiés dans les Releases GitHub.
# Déclenché par un tag de version : git tag v1.0.0 && git push origin v1.0.0
# (la version du tag doit être celle de package.json).
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  installers:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Version du tag = version de package.json
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"

      # Partage par lien : mêmes réglages publics que le site (clé « publishable » Supabase)
      - name: Installeurs (Windows .exe, macOS .dmg, Linux AppImage et .deb)
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_KEY: ${{ secrets.VITE_SUPABASE_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Pas de certificat de signature : Windows (SmartScreen) et macOS (Gatekeeper) avertiront au premier lancement
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npm run ${{ startsWith(github.ref, 'refs/tags/v') && 'release' || 'dist' }}

      - name: Installeurs (essai sans tag)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: installeurs-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
            release/*.deb
          if-no-files-found: ignore
